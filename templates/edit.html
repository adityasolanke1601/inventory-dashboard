<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit — {{ product.name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="noise"></div>
<aside class="sidebar">
  <div class="brand">
    <span class="brand-icon">◈</span>
    <span class="brand-name">StockPilot</span>
  </div>
  <nav class="nav">
    <a href="/" class="nav-item">← Back to Dashboard</a>
  </nav>
</aside>
<main class="main edit-page">
  <header class="topbar">
    <div class="topbar-title">
      <h1>Edit Product</h1>
      <span class="subtitle">{{ product.name }}</span>
    </div>
  </header>
  <div class="edit-card">
    <form method="POST" action="/edit/{{ product.id }}" class="modal-form edit-form">
      <div class="form-row">
        <label>Product Name</label>
        <input type="text" name="name" value="{{ product.name }}" required>
      </div>
      <div class="form-row">
        <label>Category</label>
        <input type="text" name="category" value="{{ product.category }}" required>
      </div>
      <div class="form-row two-col">
        <div>
          <label>Quantity</label>
          <input type="number" name="quantity" value="{{ product.quantity }}" required min="0">
        </div>
        <div>
          <label>Unit Price ($)</label>
          <input type="number" name="unit_price" value="{{ product.unit_price }}" required min="0" step="0.01">
        </div>
      </div>
      <div class="form-row">
        <label>Low Stock Threshold</label>
        <input type="number" name="low_stock_threshold" value="{{ product.low_stock_threshold }}" min="0">
      </div>
      <div class="form-actions">
        <a href="/" class="btn-cancel" style="text-decoration:none;display:inline-flex;align-items:center;">Cancel</a>
        <button type="submit" class="btn-submit">Save Changes</button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
